version: 2

models:
  - name: stg_locations
    description: "Cleaned monitoring station metadata"
    columns:
      - name: location_id
        tests:
          - not_null
          - unique
      - name: country_code
        tests:
          - not_null

  - name: stg_sensors
    description: "Cleaned sensor details"
    columns:
      - name: sensor_id
        tests:
          - not_null
      - name: parameter
        tests:
          - accepted_values:
              values: ['pm25', 'pm10', 'no2', 'co', 'o3', 'so2']

  - name: stg_measurements
    description: "Cleaned daily measurements"
    columns:
      - name: avg_value
        tests:
          - not_null
      - name: parameter
        tests:
          - accepted_values:
              values: ['pm25', 'pm10', 'no2', 'co', 'o3', 'so2']