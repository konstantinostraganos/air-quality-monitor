name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Create dbt profile
        run: |
          mkdir -p ~/.dbt
          echo "air_quality:" > ~/.dbt/profiles.yml
          echo "  target: dev" >> ~/.dbt/profiles.yml
          echo "  outputs:" >> ~/.dbt/profiles.yml
          echo "    dev:" >> ~/.dbt/profiles.yml
          echo "      type: duckdb" >> ~/.dbt/profiles.yml
          echo "      path: ${{ github.workspace }}/openaq_pipeline.duckdb" >> ~/.dbt/profiles.yml
          echo "      schema: air_quality" >> ~/.dbt/profiles.yml

      - name: Run dbt models
        run: |
          cd analytics
          dbt run
          dbt test